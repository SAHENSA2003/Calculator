<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Responsive.css">
</head>
<body>
    
   <div class="main">
    <div class="outPut">

    </div>
    <div class="input-btns">
        <button class="clear" value="AC">AC</button>
        <button class="factorial" value="!">!</button>
        <button class="Percent"  value="%">%</button>
        <button class="clear"  value="C">C</button>
        <button class="number" value="7">7</button>
        <button class="number" value="8">8</button>
        <button class="number" value="9">9</button>
        <button class="operator" value="/">/</button>
        <button class="number" value="4">4</button>
        <button class="number" value="5">5</button>
        <button class="number" value="6">6</button>
        <button class="operator" value="X">X</button>
        <button class="number" value="1">1</button>
        <button class="number" value="2">2</button>
        <button class="number" value="3">3</button>
        <button class="operator" value="-">-</button>
        <button class="number" value="0">0</button>
        <button  class="point" value=".">.</button>
        <button class="operator" value="+">+</button>
        <button class="isEqual" value="=">=</button>
        
    </div>
   </div>


   <script src="script.js"></script>

</body>
</html>
